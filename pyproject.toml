[project]
name = "tech-panic-tracker"
version = "0.0.1"
description = "Pipeline and validation tooling for the Tech-Panic Tracker dataset"
requires-python = ">=3.12"
dependencies = [
    "frictionless>=5.18",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["google-genai>=1.0", "pydantic>=2.7", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "pipeline.validate"]
