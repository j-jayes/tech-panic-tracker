name: validate

on:
  push:
    paths: ["data/**", "schemas/**", "pipeline/**", "tests/**", "docs/codebook.md", "pyproject.toml"]
  pull_request:
    paths: ["data/**", "schemas/**", "pipeline/**", "tests/**", "docs/codebook.md", "pyproject.toml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Schema + cross-table validation
        run: python -m pipeline.validate
      - name: Tests
        run: python -m pytest -q
      - name: Codebook staleness check (constitution VI)
        run: |
          python -m pipeline.codebook
          git diff --exit-code docs/codebook.md
